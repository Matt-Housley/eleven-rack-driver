name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or need?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution or idea

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Alternatives you've considered, related hardware/DAW details, etc.
