name: CodeQL

# Advanced CodeQL setup. The native code (HAL plug-in, USB engine, diagnostic
# tools) is built with raw clang via a shell script — no Xcode/CMake project —
# which the default setup's autobuild can't drive, so C/C++ is compiled manually
# here so CodeQL can trace and analyse it. GitHub Actions workflows are analysed
# too.
#
# Swift (the menu-bar app) is deliberately NOT scanned: CodeQL traces compiled
# builds by injecting a library via DYLD_INSERT_LIBRARIES, which macOS SIP strips
# from Apple's signed swiftc/swift-frontend — so a raw-swiftc build (no Xcode or
# SwiftPM project) can't be extracted. The app is UI glue with almost no native
# security surface; the security-relevant code (USB, shared-memory ring, HAL
# plug-in) is the C/C++ that IS scanned here.
#
# NOTE: GitHub can't run this while "Default" code scanning is enabled. Switch it
# to "Advanced" (Settings -> Code security -> CodeQL analysis).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 6 * * 1'   # weekly, Mondays

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-14   # Apple Silicon; needed to build the macOS C/C++ code
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build C/C++ (plug-in, engine, diagnostic tools)
        if: matrix.language == 'c-cpp'
        run: |
          set -euxo pipefail
          for f in ElevenRackBridge/*.c; do
            clang -O0 -c "$f" -I ElevenRackBridge -o "/tmp/$(basename "$f").o" \
              -Wno-deprecated-declarations
          done
          clang++ -std=c++17 -O0 -c ElevenRackAudioPlugin/ElevenRackAudioPlugin.cpp \
            -I ElevenRackBridge -o /tmp/plugin.o -Wno-deprecated-declarations

      - name: Perform analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
